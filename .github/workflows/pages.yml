# Deploys docs/ (the desk site rendered by stock-scout/webapp.py) to GitHub Pages.
#
# The deploy branch is `bot/site` — the branch the box's fine-grained
# contents-only PAT pushes after every Saturday rebuild (distributed-desk plan
# §2: a compromised box can vandalise the site branch at worst, never main or
# the workflows; this file rides on bot/site unchanged from its seeding, which
# is exactly why a contents-only PAT can keep pushing there). A manual
# workflow_dispatch deploys main's docs/ snapshot as the fallback.
#
# `enablement: true` lets the first run CREATE the Pages site, so no manual
# Settings -> Pages step is needed as long as Actions may use the pages scopes.
name: Deploy the desk site to GitHub Pages

on:
  push:
    branches: ["bot/site"]
    paths: ["docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
