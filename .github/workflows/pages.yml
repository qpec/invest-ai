# MANUAL FALLBACK ONLY. The site deploys via GitHub's classic branch mode:
# Settings -> Pages -> Source: "Deploy from a branch" -> bot/site, /docs.
# The box pushes bot/site every Saturday and GitHub publishes it directly —
# no Actions run, no github-pages environment branch policy to reject the
# push (which is exactly how the Actions-based deploy kept failing: the
# auto-created environment only allowed the default branch). This workflow
# remains solely as a hand-triggered redeploy of whatever ref it is run on.
name: Deploy the desk site to GitHub Pages (manual fallback)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
